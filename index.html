<style>

*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#17212b}
header{background:var(--n);color:white;padding:16px 20px;font-weight:900;font-size:20px}
.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px #00000012}
button,input,select{font:inherit;border-radius:11px;border:1px solid #ccd5dd;padding:13px}
button{background:var(--n);color:#fff;border:0;font-weight:800;cursor:pointer}.secondary{background:#e5ebf0;color:#17324d}.good{background:var(--g)}.danger{background:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.hide{display:none!important}
.big{font-size:42px;font-weight:900;text-align:center}.timer{font-size:68px;font-weight:950;text-align:center;font-variant-numeric:tabular-nums}
.muted{color:#667684}.answer{display:block;width:100%;margin:8px 0;text-align:left}.answer.sel{outline:4px solid #9bbbd6}
.status{padding:10px;border-radius:9px;background:#edf2f6;margin:6px 0}.ok{background:#def4e7}.bad{background:#fae1e1}
.pill{display:inline-block;padding:5px 9px;background:#e8eef3;border-radius:99px;margin:3px;font-size:13px}.check{opacity:1;text-decoration:line-through;background:#dff5e7!important;border:2px solid #22a35a;color:#116534;font-weight:900}
.tabs{display:flex;gap:7px;flex-wrap:wrap;overflow:visible;margin-bottom:12px}.tabs button{white-space:normal;flex:1 1 150px}
.code{letter-spacing:5px}.teamBtn{min-height:56px}

/* v13 mobile-first fixes */
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{min-width:0}
header{width:100%;padding:14px 16px;font-size:18px;white-space:normal}
main{width:min(1180px,100%);max-width:100%;padding:16px;margin:0 auto}
.card{max-width:100%;overflow:hidden}
.grid{min-width:0}
button,select,input{max-width:100%;min-width:0}
#setup .card{width:100%;max-width:980px;margin:0 auto}
#setup .grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:10px}
#setup button{white-space:normal;line-height:1.15;padding:15px 8px}

}

@keyframes nextFlash{0%,100%{transform:scale(1)}50%{transform:scale(1.025);box-shadow:0 0 24px rgba(255,180,0,.65)}}.next-warning{background:#fff0b8!important;border:3px solid #f0a000!important;animation:nextFlash .8s infinite;font-weight:900}.current-warning{background:#dff5e7!important;border:3px solid #22a35a!important;font-weight:900}#playerRanking .status{margin:6px 0}
/* v15 TV / spectator polish */
#screenView{min-height:calc(100vh - 70px)}
#screenView>.card{
  max-width:1400px;margin:18px auto;padding:34px;border-radius:28px;
  box-shadow:0 14px 45px rgba(0,0,0,.12);min-height:75vh;
}
#screenTitle{text-align:center;font-size:42px;line-height:1.1;margin:8px 0 18px}
#screenTimer{
  text-align:center;font-size:88px;font-weight:900;line-height:1;
  margin:12px auto 24px;min-height:88px;
}
#screenStatus{max-width:1100px;margin:0 auto}
#screenStatus .status{
  border-radius:18px;padding:14px 20px;margin:8px 0;
  box-shadow:0 4px 12px rgba(0,0,0,.05);
}
.tv-current{
  background:#dff5e7!important;border:4px solid #22a35a!important;
  transform:scale(1.02);box-shadow:0 8px 30px rgba(34,163,90,.22)!important;
}
.tv-next{
  background:#fff0b8!important;border:3px solid #f0a000!important;
}
.tv-rank{
  display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:14px;
}
.tv-rank-no{font-size:28px;font-weight:900;text-align:center}
.tv-rank-name{font-size:28px;font-weight:900}
.tv-rank-tag{font-size:18px;font-weight:900}
@media(max-width:700px){
  #screenView>.card{margin:6px;padding:18px;min-height:85vh}
  #screenTitle{font-size:30px}
  #screenTimer{font-size:64px;min-height:64px}
  .tv-rank{grid-template-columns:48px 1fr auto;gap:8px}
  .tv-rank-no,.tv-rank-name{font-size:20px}
  .tv-rank-tag{font-size:13px}
}


/* Promi-Mix */
.pm-stage{max-width:1050px;margin:auto;text-align:center}
.pm-puzzle{position:relative;width:min(72vw,720px);aspect-ratio:1/1;margin:18px auto;border-radius:24px;overflow:hidden;background:#10283e;box-shadow:0 15px 45px rgba(0,0,0,.22)}
.pm-puzzle img{width:100%;height:100%;object-fit:cover;display:block}
.pm-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.pm-tile{background:#193852;border:1px solid rgba(255,255,255,.45);transition:opacity .35s,transform .35s}
.pm-tile.open{opacity:0;transform:scale(.92);pointer-events:none}
.pm-solution{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:18px;align-items:end;margin-top:20px}
.pm-photo{background:#edf2f6;border-radius:20px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.pm-photo img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px}
.pm-photo .label{font-weight:900;font-size:20px;padding:10px 4px}
.pm-config{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pm-config input{width:100%}
@media(max-width:700px){
 .pm-puzzle{width:100%}
 .pm-solution{grid-template-columns:1fr}
 .pm-config{grid-template-columns:1fr}
}

/* v18 Blackout-Bilderpiel */
.tour-photo{display:block;width:100%;max-height:58vh;object-fit:contain;border-radius:18px;background:#101820;box-shadow:0 10px 28px #0002}
.tour-host-photo{max-height:420px;margin:10px auto}
.tour-score{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px;margin-top:12px}.tour-score .status{text-align:center}
#playerTourPhoto{width:100%;max-height:42vh;object-fit:contain;border-radius:14px;background:#101820;margin:8px 0}
@media(max-width:700px){#playerView.tour-active #buzzBtn{height:110px!important;min-height:110px!important;font-size:30px!important}#playerView.tour-active .card{padding:10px}.tour-photo{max-height:50vh}}

/* v22 standings */
.tour-tv-score{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:7px;margin:12px auto 18px;max-width:1100px}.tour-tv-score .status{text-align:center;margin:0;padding:8px}.tour-standings{max-width:900px;margin:20px auto}.tour-standings-row{display:grid;grid-template-columns:70px 1fr 100px;gap:12px;align-items:center;font-size:26px;padding:14px 18px}.tour-standings-row:nth-child(1){font-size:34px;background:#fff0b8}.tour-standings-row:nth-child(2){font-size:31px}.tour-standings-row:nth-child(3){font-size:29px}@media(max-width:700px){.tour-tv-score{grid-template-columns:repeat(3,1fr)}.tour-standings-row{grid-template-columns:45px 1fr 60px;font-size:20px;padding:10px}}

/* v28 Bettgeflüster */
.zg-rounds{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:8px;margin:12px 0}
.zg-round{padding:10px;border-radius:12px;background:#edf2f6;text-align:center;font-weight:900}
.zg-round.active{background:#dff5e7;border:3px solid #22a35a}
.zg-round.done{background:#17324d;color:white}
.zg-rank{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:12px 14px}
.zg-rank:first-child{background:#fff0b8;font-size:20px}
.zg-duos{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.zg-choice{width:100%;min-height:70px;font-size:20px;margin:6px 0}
.zg-rps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.zg-rps button{min-height:90px;font-size:20px}
.zg-hearts{font-size:32px;letter-spacing:3px}
.zg-phone-title{text-align:center;font-size:25px;font-weight:900;margin:8px 0 16px}
.zg-phone-big{text-align:center;font-size:54px;font-weight:950;margin:18px 0}
.zg-go{background:#dff5e7!important;border:4px solid #22a35a!important}
@media(max-width:700px){
  .zg-rounds{grid-template-columns:1fr}
  .zg-rank{grid-template-columns:40px 1fr auto;padding:9px}
  .zg-rps button{font-size:17px;min-height:82px;padding:8px}
}


/* v43 Transfer-Tinder mobile compact */
.tt-stage{padding:6px 8px!important;margin:4px 0!important;font-size:15px!important;line-height:1.12}

#playerView.tt-active #playerRanking .status{padding:5px 7px;margin:3px 0;font-size:13px}
#playerView.tt-active #playerCountdown{font-size:38px;min-height:0;margin:3px 0}

.tt-score-mini .pill{font-size:11px!important}

  .tt-stage{font-size:14px!important}

/* v44 Blackout-Bilder: Foto auch auf Kapitän-Handy */

/* QUOTEN-KOMA */

let TT_PLAYERS=[];
let ttIdx=0,ttReveal=0,ttPhase="idle",ttBuzzOrder=[],ttAnswerIndex=0,ttAnswerEnd=0,ttTimer=null;
let ttScores={team1:0,team2:0,team3:0},ttWinner=null,ttLockedTeams=new Set();

function ttShufflePlayers(){
  TT_PLAYERS=[...TT_PLAYERS_MASTER];
  for(let i=TT_PLAYERS.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[TT_PLAYERS[i],TT_PLAYERS[j]]=[TT_PLAYERS[j],TT_PLAYERS[i]];}
}
ttShufflePlayers();
function ttNewGame(){
  clearInterval(ttTimer);ttShufflePlayers();ttIdx=0;ttReveal=0;ttPhase="idle";ttBuzzOrder=[];ttAnswerIndex=0;ttAnswerEnd=0;ttScores={team1:0,team2:0,team3:0};ttWinner=null;ttLockedTeams=new Set();buzzOpen=false;buzzExpired=false;ttBroadcast();renderHost();
}
function ttTeamName(k){return D.teams[k]?D.teams[k].name:k}
function ttPoints(){return 1}
function ttStageHtml(p,limit,showAnswer=false){
  let rows=p.stages.slice(0,limit).map((x,i)=>"<div class='status tt-stage'><b>"+x[0]+"</b>"+(x[1]?" · <span class='pill'>"+x[1]+"</span>":"")+" · <b>"+x[2]+"</b></div>").join("");
  return rows+(showAnswer?"<div class='status ok' style='font-size:34px;text-align:center'><b>⚽ "+p.name+"</b></div>":"");
}
function ttScoreHtml(){
  return "<div class='tour-score'>"+["team1","team2","team3"].map(t=>"<div class='status'><b>"+ttTeamName(t)+"</b><br><span class='big'>"+ttScores[t]+"</span> P</div>").join("")+"</div>";
}
function ttState(){
  const p=TT_PLAYERS[ttIdx];
  return {type:"ttState",idx:ttIdx,total:TT_PLAYERS.length,phase:ttPhase,reveal:ttReveal,stages:p.stages.slice(0,ttPhase==="solved"?p.stages.length:ttReveal),answer:ttPhase==="solved"?p.name:null,
    buzzOpen:buzzOpen,order:[...ttBuzzOrder],current:ttBuzzOrder[ttAnswerIndex]||null,answerEnd:ttAnswerEnd,expired:buzzExpired,
    scores:{...ttScores},points:ttPoints(),locked:[...ttLockedTeams],winner:ttWinner};
}
function ttBroadcast(){sendAll(ttState())}
function ttStartRound(){
  clearInterval(ttTimer);clearInterval(buzzAnswerTimer);
  ttReveal=1;ttPhase="playing";ttBuzzOrder=[];ttAnswerIndex=0;ttAnswerEnd=0;ttWinner=null;ttLockedTeams=new Set();buzzExpired=false;buzzOpen=true;
  ttBroadcast();renderHost();
}
function ttRevealNext(){
  if(ttPhase!=="playing")return;
  const p=TT_PLAYERS[ttIdx];
  if(ttReveal<p.stages.length){ttReveal++;ttBuzzOrder=[];ttAnswerIndex=0;ttAnswerEnd=0;/* ausgeschlossene Teams bleiben für diesen Fußballer raus */buzzExpired=false;buzzOpen=true;ttBroadcast();renderHost();}
}
function ttBuzz(name){
  if(ttPhase!=="playing"||!buzzOpen||ttBuzzOrder.includes(name))return;
  const team=TT_TEAMS[name]; if(!team||ttLockedTeams.has(team))return;
  ttBuzzOrder.push(name);
  if(ttBuzzOrder.length===1){ttAnswerIndex=0;ttStartAnswerTimer();}
  ttBroadcast();renderHost();
}
function ttStartAnswerTimer(){
  clearInterval(ttTimer);const name=ttBuzzOrder[ttAnswerIndex];if(!name){ttAnswerEnd=0;ttBroadcast();renderHost();return;}
  buzzExpired=false;ttAnswerEnd=Date.now()+10000;ttBroadcast();renderHost();
  ttTimer=setInterval(()=>{if(Date.now()>=ttAnswerEnd){clearInterval(ttTimer);ttAnswerEnd=0;buzzExpired=true;ttBroadcast();renderHost();}},150);
}
function ttWrong(){
  const name=ttBuzzOrder[ttAnswerIndex];if(!name)return;
  const team=TT_TEAMS[name];if(team)ttLockedTeams.add(team);
  clearInterval(ttTimer);buzzExpired=false;ttAnswerEnd=0;
  let next=-1;for(let i=ttAnswerIndex+1;i<ttBuzzOrder.length;i++){if(!ttLockedTeams.has(TT_TEAMS[ttBuzzOrder[i]])){next=i;break;}}
  if(next>=0){ttAnswerIndex=next;ttStartAnswerTimer();}else{buzzOpen=true;ttBroadcast();renderHost();}
}
function ttRight(){
  const name=ttBuzzOrder[ttAnswerIndex];if(!name)return;
  const team=TT_TEAMS[name];clearInterval(ttTimer);ttAnswerEnd=0;buzzOpen=false;ttWinner={name,team,points:ttPoints()};ttScores[team]+=ttWinner.points;ttPhase="solved";ttBroadcast();renderHost();
}
function ttSolve(){
  if(ttPhase!=="playing")return;
  clearInterval(ttTimer);clearInterval(buzzAnswerTimer);ttAnswerEnd=0;buzzOpen=false;buzzExpired=false;
  const p=TT_PLAYERS[ttIdx];ttReveal=p.stages.length;ttWinner=null;ttPhase="solved";ttBroadcast();renderHost();
}
function ttNext(){
  clearInterval(ttTimer);ttIdx++;if(ttIdx>=TT_PLAYERS.length){ttShufflePlayers();ttIdx=0;}ttReveal=0;ttPhase="idle";ttBuzzOrder=[];ttAnswerIndex=0;ttAnswerEnd=0;ttWinner=null;ttLockedTeams=new Set();buzzOpen=false;buzzExpired=false;ttBroadcast();renderHost();
}

let hlb=null,hlbTimer=null;
function hlbAlive(){return hlb?hlb.players.filter(p=>p.life>0):[]}
function hlbScoreHtml(){if(!hlb)return "";return "<div class='tour-score'>"+hlb.players.map(p=>"<div class='status' style='"+(p.life<=0?"opacity:.45;":"")+"'><b>"+p.name+"</b><br><span style='font-size:22px'>"+"❤️".repeat(p.life)+"🖤".repeat(Math.max(0,p.max-p.life))+"</span>"+(p.life<=0?"<br><b>RAUS</b>":"")+"</div>").join("")+"</div>"}
function hlbDeck(){return [...HLB_FIXED,...hlShuffle(HL_BANK)]}
function hlbBroadcast(extra={}){if(!hlb)return;const q=hlb.deck[hlb.idx];sendAll({type:"hlbState",phase:hlb.phase,question:q?q.q:"",threshold:q?hlFmt(q.t,q.u):"",category:q?q.cat:"",period:q&&q.period?q.period:"",idx:hlb.idx,players:hlb.players.map(x=>({name:x.name,life:x.life,max:x.max})),answers:hlb.answers||{},result:hlb.result||null,actual:hlb.actual||null,winner:hlb.winner||null,end:hlb.end||null,...extra})}
function hlbStart(){const chosen=[...document.querySelectorAll('.hlbPick:checked')].map(x=>x.value);if(chosen.length<2)return alert('Bitte mindestens 2 Spieler auswählen.');const players=chosen.map(n=>{const el=document.querySelector('.hlbLife[data-name="'+n+'"]');const life=el?+el.value:3;return {name:n,life,max:life}});hlb={players,deck:hlbDeck(),idx:0,phase:'question',answers:{},result:null,actual:null,winner:null,end:null};hlbBeginQuestion()}

function roomCode(){return Math.random().toString(36).slice(2,8).toUpperCase();}
function ensurePeer(){
  if(typeof Peer==="undefined"){alert("PeerJS konnte nicht geladen werden. Bitte Internetverbindung prüfen.");return false;}
  return true;
}
function openJoin(kind){
  role=kind;

function host(){
  if(!ensurePeer())return;
  role="host"; room=roomCode();
  peer=new Peer("kroatien-"+room);
  peer.on("open",()=>{
    show("hostView"); $("roomCode").textContent=room; refreshConnections(); renderHost();
  });
  peer.on("connection",c=>{
    c.on("data",m=>onHostMessage(m,c));
  });
  peer.on("error",e=>alert("Verbindungsfehler: "+e.type));
}
function join(teamRole){
  if(!ensurePeer())return;
  room=$("roomIn").value.trim().toUpperCase();
  if(!room){alert("Bitte Raumcode eingeben.");return;}
  role=teamRole;
  peer=new Peer();
  peer.on("open",()=>{
    conn=peer.connect("kroatien-"+room,{reliable:true});
    conn.on("open",()=>{
      conn.send({type:"join",role});
      if(role==="screen") show("screenView");
      else{
        show("captainView");
        $("teamName").innerHTML="<b>"+D.teams[role].name+"</b><div class='muted'>"+D.teams[role].players+"</div>";
      }
    });
    conn.on("data",onClientMessage);
    conn.on("error",()=>alert("Verbindung zum Spielleiter fehlgeschlagen."));
  });
}
function joinPlayer(){
  room=$("roomIn").value.trim().toUpperCase();
  if(!room){alert("Bitte Raumcode eingeben.");return;}
  const name=$("playerSelect").value;
  if(!name){alert("Bitte Spieler auswählen.");return;}
  role="player:"+name;

  const connectPlayer=()=>{
    conn=peer.connect("kroatien-"+room,{reliable:true});
    conn.on("open",()=>{
      conn.send({type:"join",role,name});
      show("playerView");
      $("playerName").textContent=name;
      $("buzzState").textContent="Verbunden – warte auf Jan …";
    });
    conn.on("data",onClientMessage);
    conn.on("error",()=>alert("Verbindung fehlgeschlagen. Bitte Raumcode prüfen."));
  };

  if(!peer){
    if(!window.Peer){alert("PeerJS konnte nicht geladen werden. Internetverbindung prüfen.");return;}
    peer=new Peer();
    peer.on("open",connectPlayer);
    peer.on("error",e=>alert("Verbindung fehlgeschlagen: "+e.type));
  }else if(peer.open){
    connectPlayer();
  }else{
    peer.once("open",connectPlayer);
  }
}
function onHostMessage(m,c){
  if(m&&m.type==="qkBet" && modeName==="quotenkoma"){ qkSubmit(m.team,m.bets); return; }
  if(m.type==="hlChoice" && modeName==="higherlower") { hlChoose(m.choice,m.name); return; }
  if(m.type==="hltChoice" && modeName==="higherlowerteam") { hltChoose(m.choice,m.team); return; }
  if(m.type==="hlbChoice" && modeName==="higherlowerbed") { hlbChoose(m.choice,m.name); return; }
  if(m.type==="join"){conns[m.role]=c; refreshConnections(); if(modeName==="quotenkoma") setTimeout(()=>qkSendTo(m.role),50);}
  if(m.type==="tourBuzz" && modeName==="tourpics" && buzzOpen && ["team1","team2","team3"].includes(m.team) && !buzzOrder.includes(m.team)){
    buzzOrder.push(m.team); if(buzzOrder.length===1){buzzAnswerIndex=0;startBuzzAnswerTimer();}
    tourCaptainBuzzState(true); if(conns.screen)conns.screen.send(buzzBoardMessage()); renderHost(); return;
  }
  if(m.type==="buzz" && modeName==="transfertinder"){ttBuzz(m.name);return;}
  if(m.type==="buzz" && buzzOpen && !buzzOrder.includes(m.name)){
    buzzOrder.push(m.name);
    if(buzzOrder.length===1){buzzAnswerIndex=0; startBuzzAnswerTimer();}
    broadcastBuzzOrder(); renderHost();
  }

  if(m.type==="zgHlChoice" && modeName==="zimmer" && zgRound===0){ zgHlChoose(m.choice,m.name); return; }

  if(m.type==="zgLive" && modeName==="zimmer"){
    if(!ZG_PLAYERS.includes(m.name) || zgOut.has(m.name))return;
    zgLive[m.name]=m.data||{};
    zgLiveBroadcast();
    renderHost();
    return;
  }
  if(m.type==="zgAnswer" && modeName==="zimmer"){
    const name=m.name;
    if(!ZG_PLAYERS.includes(name) || zgOut.has(name) || zgAnswers[name]!==undefined)return;
    zgAnswers[name]=Number(m.value);
    renderHost();
    if(zgRound>0 && zgRound<4 && zgRemaining().every(n=>zgAnswers[n]!==undefined)) zgRevealRound();
    return;
  }
  if(m.type==="zgReaction" && modeName==="zimmer" && zgRound===4 && zgPhase==="playing"){
    const name=m.name;
    if(!ZG_PLAYERS.includes(name) || zgOut.has(name) || zgAnswers[name]!==undefined)return;
    zgAnswers[name]={ms:Number(m.ms),early:!!m.early};
    renderHost();
    if(zgRemaining().every(n=>zgAnswers[n]!==undefined)) zgRevealRound();
    return;
  }
  if(m.type==="zgRpsChoice" && modeName==="zimmer" && zgRound===4 && zgPhase==="rps" && zgRpsPlayers.includes(m.name)){
    if(Number(m.token)!==zgRpsToken || zgRpsChoices[m.name])return;
    zgRpsChoices[m.name]=m.choice;
    zgLive[m.name]={kind:"rps",chosen:true};
    zgLiveBroadcast(); renderHost();
    if(zgRpsPlayers.every(n=>zgRpsChoices[n])) zgResolveRps();
    return;
  }
  if(m.type==="answer"){
    if(modeName==="emoji" && (emojiPhase==="title"||emojiPhase==="artist")) handleEmojiAnswer(m.role,m.value);
    else {
      answers[m.role]=m.value; renderHost();
      if(modeName==="quiz" && ["team1","team2","team3"].every(t=>answers[t]!==undefined)) revealQuiz(true);
      if(modeName==="estimate" && ["team1","team2","team3"].every(t=>answers[t]!==undefined)) revealEstimate(true);
    }
  }

      $("screenTimer").textContent="";
      $("screenStatus").innerHTML="<div class='status ok' style='text-align:center;font-size:30px'><b>✅ RICHTIG</b><br>"+m.team+": <b>"+m.answer+"</b><br><span style='font-size:22px'>Gültige Lösung"+(m.matches.length>1?"en":"")+": "+m.matches.join(" + ")+"</span></div><div class='muted' style='text-align:center;font-size:20px;margin-top:18px'>Warte auf das nächste Team …</div>"+categoryProgressHtml(m.usedCount,m.totalCount);
    } else if(role && role.startsWith("team")){
      $("capTimer").textContent="";
      $("capGame").innerHTML="<div class='status ok' style='font-size:22px;text-align:center'><b>✅ "+m.team+":</b><br>„"+m.answer+"“<br><br><b>Gültige Lösung"+(m.matches.length>1?"en":"")+": "+m.matches.join(" + ")+"</b></div><div class='status' style='text-align:center;font-size:20px'><b>Das nächste Team ist dran.</b></div>"+categoryProgressHtml(m.usedCount,m.totalCount);
    }
  }
  if(m.type==="reset"){
    clearInterval(timerInt);
    if(role==="screen"){$("screenTitle").textContent="Warte auf Jan …";$("screenTimer").textContent="–";$("screenStatus").innerHTML="";}
    else {$("capTimer").textContent="–";$("capGame").innerHTML="<p class='muted'>Warte auf Jan …</p>";}
  }
  if(m.type==="reveal"){
    clearInterval(timerInt);
    if(m.scores){ if(m.kind==="estimate" || m.scoreKind==="estimate") clientEstimateScores=m.scores; else clientQuizScores=m.scores; }
    if(role==="screen"){ $("screenTimer").textContent="";
      $("screenStatus").innerHTML=m.html;
    }else{
      clearInterval(timerInt);
      $("capTimer").textContent="";
      $("capGame").innerHTML="<h2>Auflösung</h2>"+m.html;
    }
  }

function countdown(end,el,done){
  clearInterval(timerInt);
  const tick=()=>{
    const s=Math.max(0,Math.ceil((end-Date.now())/1000));
    el.textContent=s;
    if(s<=0){clearInterval(timerInt);if(done)done();}
  };
  tick(); timerInt=setInterval(tick,200);
}

    $("screenTitle").textContent=m.title;

      $("screenStatus").innerHTML="<div class='big' style='font-size:80px;margin:25px 0'>"+m.emojis+"</div><div class='muted'>Songtitel gesucht</div>";

function submitChoice(v,b){

function submitText(){
  const e=$("txtAns"); if(!e||!e.value.trim())return;

    clearInterval(timerInt); $("capTimer").textContent="";

function pointStoreForMode(mode){
  if(mode==="quiz")return quizScores;
  if(mode==="estimate")return estimateScores;
  if(mode==="category")return categoryScores;
  if(mode==="emoji")return emojiPoints;
  if(mode==="transfertinder")return ttScores;
  if(mode==="tourpics")return tourScores;
  return null;
}
function manualPointsHtml(mode){

  return "<details class='status' style='margin:10px 0;border:2px solid #b68b00;background:#fffaf0'><summary style='cursor:pointer;font-weight:900'>✍️ PUNKTE MANUELL VERGEBEN / KORRIGIEREN</summary><div class='muted' style='margin:7px 0'>Für Korrekturen oder Sonderfälle. Plus und Minus wirken sofort auf den aktuellen Spielstand.</div><div class='grid'>"+["team1","team2","team3"].map(t=>"<div class='status'><b>"+D.teams[t].name+"</b><br><button class='manualPoint' data-team='"+t+"' data-delta='-1'>−1</button> <b style='font-size:22px'>"+(store[t]||0)+"</b> <button class='manualPoint good' data-team='"+t+"' data-delta='1'>+1</button></div>").join("")+"</div></details>";
}
function adjustManualPoint(team,delta){
  const store=pointStoreForMode(modeName); if(!store)return;
  store[team]=Math.max(0,(Number(store[team])||0)+Number(delta));
  if(modeName==="transfertinder")ttBroadcast();
  if(modeName==="tourpics"){tourSendState();tourCaptainBuzzState(buzzOpen);}

}

function startRound(sec){
  answers={}; const end=Date.now()+sec*1000;
  if(modeName==="quiz"){
    const q=D.quiz[qidx]; sendAll({type:"start",kind:"quiz",end,title:"Frage "+(qidx+1)+": "+q[0],options:q[1],scores:{...quizScores}});
  }else{
    sendAll({type:"start",kind:"estimate",end,title:"Dicht daneben: "+D.estimate[eidx][0],scores:{...estimateScores}});
  }
  renderHost();
}
function revealQuiz(auto=false){
  const q=D.quiz[qidx], correct=q[2];
  if(!quizAwarded.has(qidx)){
    ["team1","team2","team3"].forEach(t=>{if(answers[t]!==undefined && Number(answers[t])===correct)quizScores[t]=(quizScores[t]||0)+1;});
    quizAwarded.add(qidx);
  }
  let html="";
  ["team1","team2","team3"].forEach(t=>{
    const a=answers[t],ok=Number(a)===correct;
    html+="<div class='status "+(ok?"ok":"bad")+"'>"+D.teams[t].name+": "+(a===undefined?"—":String.fromCharCode(65+Number(a))+" · "+q[1][Number(a)])+"</div>";
  });
  html+="<p><b>Richtig: "+String.fromCharCode(65+correct)+" · "+q[1][correct]+"</b></p>"+quizScoreHtml(quizScores);
  const hr=$("hostReveal"); if(hr)hr.innerHTML="<div class='card'>"+html+"</div>";
  sendAll({type:"reveal",html,scores:{...quizScores}}); sendShortStandings(quizScores,"ADRIA-ABITUR · NACH FRAGE "+(qidx+1));
  renderHost();
  const hr2=$("hostReveal"); if(hr2)hr2.innerHTML="<div class='card'>"+html+"</div>";
}

function simpleNorm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/&/g,"and").replace(/[^a-z0-9]/g,"");
}
function emojiCorrect(input,target){
  const a=simpleNorm(input), b=simpleNorm(target);
  if(a===b)return true;
  return editDistance(a,b)<=Math.max(1,Math.min(2,Math.floor(b.length/8)));
}

  const phaseKey=emojiPhase==="title"?"title":"artist";
  emojiGuesses[phaseKey][team].push(String(value));
  sendAll({type:"emojiGuess",phase:phaseKey,team:D.teams[team].name,value:String(value)});
  const target=emojiPhase==="title"?s[1]:s[2];
  if(emojiCorrect(value,target)){
    if(emojiPhase==="title"){
      emojiWinner=team;
      emojiPoints[team]+=2;
      sendEmojiFeedback(team,"Richtig! +2 Punkte",true);
      startEmojiArtist(team);

      emojiPoints[team]+=1;

function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");}
function editDistance(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    dp[i][j]=Math.min(
      dp[i-1][j]+1,
      dp[i][j-1]+1,
      dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
    );
  }
  return dp[m][n];
}
function fuzzyMatch(input,list){
  const ni=norm(input);
  if(!ni)return null;
  let best=null,bestDist=999;
  for(const x of list){
    const nx=norm(x);
    if(nx===ni)return x;
    if(ni.length>=4 && (nx.includes(ni)||ni.includes(nx))) return x;
    const d=editDistance(ni,nx);
    if(d<bestDist){bestDist=d;best=x;}
  }
  // 1 typo for short answers; up to 2 for medium/long answers.
  const allowed=ni.length<=4?1:(ni.length<=8?2:2);
  return bestDist<=allowed?best:null;
}
function categoryMatches(input,list){
  const ni=norm(input); if(!ni)return [];
  // Eine eindeutige Teilantwort wie „Müller“ darf mehrere vollständige Lösungen treffen.
  let matches=list.filter(x=>{const nx=norm(x);return nx===ni || (ni.length>=4 && nx.split(" ").includes(ni)) || (ni.length>=4 && nx.includes(ni));});
  if(matches.length)return matches;
  const one=fuzzyMatch(input,list); return one?[one]:[];
}
function nextCategoryTeam(after){
  const order=["team1","team2","team3"], start=order.indexOf(after);
  for(let i=1;i<=order.length;i++){
    const t=order[(start+i)%order.length];
    if(!catOut.has(t)) return t;
  }
  return null;
}
function rejectCategory(t){
  const a=answers[t];
  if(a===undefined)return;
  catOut.add(t);
  catLastTeam=t;
  catTurnTeam=nextCategoryTeam(t);
  const msg={type:"categoryRejected",team:D.teams[t].name,answer:String(a),usedCount:used.size,totalCount:D.categories[catName].length};
  ["team1","team2","team3"].forEach(k=>{if(conns[k])conns[k].send(msg);});
  if(conns.screen)conns.screen.send(msg);
  answers={};
  if(catOut.size===2){
    const winner=["team1","team2","team3"].find(k=>!catOut.has(k));
    if(winner&&!categoryAwarded.has(catName)){categoryScores[winner]++;categoryAwarded.add(catName);}
    sendShortStandings(categoryScores,"LISTEN-LOTTO · NACH "+catName);
  }
  renderHost();
}
function acceptCategory(t){
  const a=answers[t], list=D.categories[catName];
  let matches=categoryMatches(a,list);

  // Wenn die Eingabe nicht eindeutig erkannt wird, kann der Spielleiter
  // sie manuell einer gültigen Lösung zuordnen (z. B. „Kinmich“ -> „Kimmich“).
  if(!matches.length){
    const manual=prompt(
      "Nicht eindeutig erkannt: "+a+"\n\n"+
      "Welche gültige Lösung ist gemeint?\n"+
      "Du kannst z. B. nur den Nachnamen eingeben (z. B. Kimmich)."
    );
    if(manual===null || !manual.trim())return;
    matches=categoryMatches(manual,list);
    if(!matches.length){
      alert("Auch diese Zuordnung wurde nicht gefunden: "+manual+"\nBitte prüfe die Schreibweise oder werte die Antwort mit dem roten X als falsch.");
      return;
    }
  }

  const fresh=matches.filter(x=>!used.has(norm(x)));
  if(!fresh.length){alert("Schon genannt: "+matches.join(" + "));return;}
  fresh.forEach(x=>used.add(norm(x)));
  catLastTeam=t;
  catTurnTeam=nextCategoryTeam(t);
  const msg={type:"categoryAccepted",team:D.teams[t].name,answer:String(a),matches:fresh,usedCount:used.size,totalCount:D.categories[catName].length};
  ["team1","team2","team3"].forEach(k=>{if(conns[k])conns[k].send(msg);});
  if(conns.screen)conns.screen.send(msg);
  answers={}; renderHost();
}

 {id:"boost_kevin",cat:"🔥 SAUFY-NAUTEN BOOSTS",name:"Schafft Kevin von Anpfiff bis Abpfiff 2,5 Liter Flüssiggold?",boost:true,o:[["yes","JA",7.50],["no","NEIN",1.10]]},
 {id:"boost_patrick",cat:"🔥 SAUFY-NAUTEN BOOSTS",name:"Schafft Patrick von Anpfiff bis Abpfiff 0,3 Liter Sprit?",boost:true,o:[["yes","JA",7.50],["no","NEIN",1.10]]},
 {id:"boost_swen",cat:"🔥 SAUFY-NAUTEN BOOSTS",name:"Schafft Swen von Anpfiff bis Abpfiff 100 Liegestütze?",boost:true,o:[["yes","JA",7.50],["no","NEIN",1.10]]}
];
const QK_KEY="quotenkoma_v1";
function qkDefault(){return {open:true,published:false,bets:{team1:[],team2:[],team3:[]},settled:{},finished:false,awards:null};}
let qk=qkLoad(); let qkSlip=[];
function qkLoad(){try{return Object.assign(qkDefault(),JSON.parse(localStorage.getItem(QK_KEY)||"null")||{});}catch(e){return qkDefault();}}
function qkSave(){try{localStorage.setItem(QK_KEY,JSON.stringify(qk));}catch(e){} qkBroadcast();}
function qkMoney(n){return Number(n||0).toFixed(2).replace(".",",")+" €";}
function qkMarket(id){return QK_MARKETS.find(x=>x.id===id);}
function qkOpt(mid,oid){const m=qkMarket(mid);return m&&m.o.find(x=>x[0]===oid);}
function qkStake(t){return (qk.bets[t]||[]).reduce((a,b)=>a+b.stake,0);}
function qkBalance(t){return 100-qkStake(t);}
function qkPayout(t){return (qk.bets[t]||[]).reduce((a,b)=>a+(b.status==="win"?b.stake*b.odds:(b.status==="void"?b.stake:0)),0);}
function qkFinal(t){return qk.finished?qkBalance(t)+qkPayout(t):qkBalance(t);}
function qkPublicState(){return {open:qk.open,published:qk.published,bets:qk.bets,settled:qk.settled,finished:qk.finished,awards:qk.awards};}
function qkSendTo(roleKey){const c=conns[roleKey];if(c)try{c.send({type:"qkState",state:qkPublicState(),markets:QK_MARKETS})}catch(e){}}
function qkBroadcast(){["team1","team2","team3","screen"].forEach(qkSendTo);}
function qkSubmit(team,bets){
 if(!qk.open||qk.finished||!["team1","team2","team3"].includes(team))return;
 if(!Array.isArray(bets)||!bets.length)return;
 const used=new Set((qk.bets[team]||[]).map(b=>b.market)); let bal=qkBalance(team);
 for(const x of bets){
   const m=qkMarket(x.market),o=m&&qkOpt(x.market,x.option),st=Number(x.stake);
   if(!m||!o||used.has(x.market)||!Number.isInteger(st)||st<1||st>20||st>bal)continue;
   qk.bets[team].push({id:Date.now()+"_"+Math.random().toString(36).slice(2),market:m.id,marketName:m.name,option:o[0],label:o[1],odds:o[2],stake:st,status:"open"});
   used.add(m.id);bal-=st;
 }
 qkSave();renderHost();qkSendTo(team);
}
function qkSettle(mid,winner){qk.settled[mid]=winner;["team1","team2","team3"].forEach(t=>(qk.bets[t]||[]).forEach(b=>{if(b.market===mid)b.status=winner==="void"?"void":(b.option===winner?"win":"lose");}));qkSave();renderHost();}
function qkUndo(mid){delete qk.settled[mid];["team1","team2","team3"].forEach(t=>(qk.bets[t]||[]).forEach(b=>{if(b.market===mid)b.status="open";}));qk.finished=false;qk.awards=null;qkSave();renderHost();}
function qkFinish(){
 const open=[];QK_MARKETS.forEach(m=>{if(["team1","team2","team3"].some(t=>(qk.bets[t]||[]).some(b=>b.market===m.id&&b.status==="open")))open.push(m.name)});
 if(open.length&&!confirm(open.length+" bespielte Märkte sind noch offen. Trotzdem Endabrechnung erstellen?"))return;
 qk.finished=true; const order=["team1","team2","team3"].sort((a,b)=>qkFinal(b)-qkFinal(a)); qk.awards={}; const pts=[5,3,1];order.forEach((t,i)=>qk.awards[t]=pts[i]);qkSave();renderHost();
}
function qkBetsHtml(team,showAll){
 const teams=showAll?["team1","team2","team3"]:[team];
 return teams.map(t=>{const bs=qk.bets[t]||[];return "<div class='qk-tv-team'><h3>"+D.teams[t].name+"</h3><div><b>Einsatz:</b> "+qkMoney(qkStake(t))+" · <b>Rest:</b> "+qkMoney(qkBalance(t))+(qk.finished?" · <b>Endstand:</b> "+qkMoney(qkFinal(t)):"")+"</div>"+(bs.length?"<table class='qk-table'>"+bs.map(b=>"<tr class='"+(b.status==="win"?"qk-win":b.status==="lose"?"qk-lose":"")+"'><td>"+b.marketName+"<br><span class='qk-small'>"+b.label+"</span></td><td>"+qkMoney(b.stake)+"</td><td>@ "+Number(b.odds).toFixed(2).replace(".",",")+"</td><td>"+(b.status==="win"?"✅ "+qkMoney(b.stake*b.odds):b.status==="lose"?"❌":b.status==="void"?"↩️":"⏳")+"</td></tr>").join("")+"</table>":"<p class='muted'>Noch keine Wetten.</p>")+"</div>"}).join("");
}
function qkRankHtml(){if(!qk.finished)return "";const order=["team1","team2","team3"].sort((a,b)=>qkFinal(b)-qkFinal(a));return "<div class='card'><h2>🏆 QUOTEN-KOMA · ENDABRECHNUNG</h2>"+order.map((t,i)=>"<div class='status qk-rank'>"+["🥇","🥈","🥉"][i]+" "+D.teams[t].name+" · "+qkMoney(qkFinal(t))+" · <b>+"+qk.awards[t]+" Olympiade-Punkte</b></div>").join("")+"</div>";}
function qkHostHtml(){
 const used=QK_MARKETS.filter(m=>["team1","team2","team3"].some(t=>(qk.bets[t]||[]).some(b=>b.market===m.id)));
 return "<div class='qk-head'><h2>🎰 QUOTEN-KOMA</h2><div>🇩🇪 Deutschland – Niederlande 🇳🇱 · 90 Minuten inkl. Nachspielzeit</div><div class='qk-status'>"+(qk.finished?"ABGERECHNET":qk.open?"WETTEN GEÖFFNET":qk.published?"TIPPS VERÖFFENTLICHT":"WETTSCHLUSS")+"</div></div>"+
 "<div class='card'><div class='grid'><button id='qkToggle' class='"+(qk.open?"danger":"good")+"'>"+(qk.open?"🔒 WETTSCHLUSS":"🔓 WETTEN WIEDER ÖFFNEN")+"</button><button id='qkPublish' "+(qk.open?"disabled":"")+">📺 TIPPS VERÖFFENTLICHEN</button><button id='qkFinish' class='good'>🏆 ENDABRECHNUNG</button><button id='qkReset' class='danger'>♻️ QUOTEN-KOMA RESET</button></div></div>"+
 qkRankHtml()+qkBetsHtml(null,true)+
 "<div class='card'><h2>⚖️ Märkte auswerten</h2><p class='muted'>Gewinnende Auswahl anklicken. Alle Wetten dieses Marktes werden automatisch abgerechnet. ↩️ macht eine Auswertung rückgängig.</p>"+(used.length?used.map(m=>"<div class='qk-market "+(m.boost?"qk-boost":"")+"'><h3>"+m.name+"</h3><div class='qk-odds'>"+m.o.map(o=>"<button class='qkSettle "+(qk.settled[m.id]===o[0]?"good":"secondary")+"' data-m='"+m.id+"' data-o='"+o[0]+"'>"+o[1]+"</button>").join("")+"<button class='qkUndo secondary' data-m='"+m.id+"'>↩️ Undo</button></div></div>").join(""):"<p>Noch keine Wetten abgegeben.</p>")+"</div>";
}
function qkClientRender(m){
 const state=m.state,markets=m.markets||QK_MARKETS; qk=Object.assign(qkDefault(),state); const team=(role||"").startsWith("team")?role:null;
 if(role==="screen"){$("screenTitle").textContent="🎰 QUOTEN-KOMA";$('screenTimer').textContent="";$("screenStatus").innerHTML="<div class='qk-head'><h2>🎰 QUOTEN-KOMA</h2><div>🇩🇪 Deutschland – Niederlande 🇳🇱</div></div>"+(state.published||state.finished?qkBetsHtml(null,true):"<div class='card'><h2>🔒 Wettscheine noch geheim</h2><p>Die Tipps werden nach Wettschluss von Jan veröffentlicht.</p></div>")+qkRankHtml();return;}
 if(!team)return;
 qkSlip=qkSlip.filter(x=>!((state.bets[team]||[]).some(b=>b.market===x.market)));
 const locked=new Set((state.bets[team]||[]).map(b=>b.market));
 let h="<div class='qk-head'><h2>🎰 QUOTEN-KOMA</h2><div class='qk-balance'>"+qkMoney(qkBalance(team))+"</div><div>verfügbares Guthaben · max. 20 € je Markt</div><div class='qk-status'>"+(state.finished?"ABGERECHNET":state.open?"WETTEN GEÖFFNET":"WETTSCHLUSS")+"</div></div>";
 if(state.published||state.finished)h+=qkBetsHtml(null,true)+qkRankHtml(); else h+=qkBetsHtml(team,false);
 if(state.open&&!state.finished){
   const cats=[...new Set(markets.map(x=>x.cat))];h+="<div class='card'><h2>Wettangebot</h2>"+cats.map(cat=>"<h2>"+cat+"</h2>"+markets.filter(x=>x.cat===cat).map(mm=>"<div class='qk-market "+(mm.boost?"qk-boost":"")+"'><h3>"+mm.name+(locked.has(mm.id)?" 🔒":"")+"</h3><div class='qk-odds'>"+mm.o.map(o=>"<button class='qk-pick "+(qkSlip.some(x=>x.market===mm.id&&x.option===o[0])?"sel":"")+"' data-m='"+mm.id+"' data-o='"+o[0]+"' "+(locked.has(mm.id)?"disabled":"")+">"+o[1]+" <b>"+Number(o[2]).toFixed(2).replace(".",",")+"</b></button>").join("")+"</div></div>").join("")).join("")+"</div>";
   h+="<div class='qk-slip'><h3>🧾 Wettschein</h3><div id='qkSlipRows'>"+(qkSlip.length?qkSlip.map((x,i)=>{const mm=markets.find(z=>z.id===x.market),o=mm.o.find(z=>z[0]===x.option);return "<div class='status'><b>"+o[1]+" @ "+o[2].toFixed(2).replace(".",",")+"</b><br>"+mm.name+" · Einsatz <input class='qkStake' data-i='"+i+"' type='number' min='1' max='20' step='1' value='"+(x.stake||5)+"'> € <button class='qkRemove danger' data-i='"+i+"'>×</button></div>"}).join(""):"Noch nichts ausgewählt.")+"</div><button id='qkSubmit' class='good' style='width:100%' "+(!qkSlip.length?"disabled":"")+">WETTEN VERBINDLICH ABGEBEN</button></div>";
 }
 $("capGame").innerHTML=h; qkBindClient();
}
function qkBindClient(){
 document.querySelectorAll(".qk-pick").forEach(b=>b.onclick=()=>{const mid=b.dataset.m,oid=b.dataset.o; qkSlip=qkSlip.filter(x=>x.market!==mid);qkSlip.push({market:mid,option:oid,stake:5});qkClientRender({state:qkPublicState(),markets:QK_MARKETS});});
 document.querySelectorAll(".qkStake").forEach(e=>e.onchange=()=>{const raw=Number(e.value)||1;let v=Math.max(1,Math.min(20,Math.round(raw)));if(raw>20)alert("Maximal 20 € pro Wette. Der Einsatz wurde auf 20 € reduziert.");qkSlip[+e.dataset.i].stake=v;e.value=v;});
 document.querySelectorAll(".qkRemove").forEach(b=>b.onclick=()=>{qkSlip.splice(+b.dataset.i,1);qkClientRender({state:qkPublicState(),markets:QK_MARKETS});});
 const sub=$("qkSubmit");if(sub)sub.onclick=()=>{document.querySelectorAll(".qkStake").forEach(e=>qkSlip[+e.dataset.i].stake=Math.max(1,Math.min(20,Math.round(Number(e.value)||1))));const total=qkSlip.reduce((a,x)=>a+x.stake,0);if(total>qkBalance(role)){alert("Nicht genug Guthaben. Verfügbar: "+qkMoney(qkBalance(role)));return;}if(!confirm("Diese "+qkSlip.length+" Einzelwetten verbindlich abgeben? Danach können sie nicht mehr geändert werden."))return;conn.send({type:"qkBet",team:role,bets:qkSlip});qkSlip=[];};
}
function qkBindHost(){
 const a=$("qkToggle");if(a)a.onclick=()=>{qk.open=!qk.open;if(qk.open)qk.published=false;qkSave();renderHost();};
 const p=$("qkPublish");if(p)p.onclick=()=>{qk.published=true;qk.open=false;qkSave();renderHost();};
 const f=$("qkFinish");if(f)f.onclick=qkFinish;
 const r=$("qkReset");if(r)r.onclick=()=>{if(confirm("Wirklich ALLE Quoten-Koma-Wetten und Ergebnisse löschen?")){qk=qkDefault();qkSave();renderHost();}};
 document.querySelectorAll(".qkSettle").forEach(b=>b.onclick=()=>qkSettle(b.dataset.m,b.dataset.o));document.querySelectorAll(".qkUndo").forEach(b=>b.onclick=()=>qkUndo(b.dataset.m));
}
/* =================== /QUOTEN-KOMA ===================== */
</script>
</body></html>
